version: '3.8'

services:
  app:
    image: php:8.2-apache
    container_name: php_app
    ports:
      - "8080:80"
    volumes:
      - ./:/var/www/html
    networks:
      - app_network
    working_dir: /var/www/html
    command: >
      bash -c "a2enmod rewrite &&
               sed -i 's|/var/www/html|/var/www/html/public|g' /etc/apache2/sites-available/000-default.conf &&
               apache2-foreground"

  composer:
    image: composer:2
    container_name: composer_cli
    working_dir: /var/www/html
    volumes:
      - ./:/var/www/html
    networks:
      - app_network

networks:
  app_network:
    driver: bridge
